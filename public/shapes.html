<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拠点の形一覧 | パケット陣取り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .page { max-width: 1280px; margin: 0 auto; padding: 0 16px 32px; }
  .page h2 { font: 20px/1.3 var(--font-display); margin: 24px 0 6px; }
  .page .desc { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
  .basic { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border-radius: 12px; padding: 14px; display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center; }
  .card canvas { display: block; }
  .card .lv { font: 700 15px var(--font-mono); }
  .card .nm { font-weight: 700; }
  .card .q { color: var(--muted); font-size: 13px; }
  .ext { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .cell { background: var(--surface); border-radius: 10px; padding: 8px 4px 6px; text-align: center; }
  .cell canvas { display: block; margin: 0 auto; }
  .cell .lv { font: 600 12px var(--font-mono); color: var(--muted); }
  .cell.country { outline: 2px solid var(--accent); }
  .back { font-size: 14px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>パケット陣取り</h1>
    <span class="brand-en">Packet Conquest</span>
  </div>
  <div class="status"><a class="back" href="./">← ゲームに戻る</a></div>
</header>

<main class="page">
  <h2>拠点の形(レベル 1〜10)</h2>
  <p class="desc">拠点の難易度(レベル)ごとに形が決まっています。レベル 10 は国です。東京の拠点はレベル 1〜5 です。</p>
  <div class="basic" id="basic"></div>

  <h2>拡張用の形(レベル 11〜99)</h2>
  <p class="desc">1 の位の形に、10 の位の数だけ外輪(最大 3 本)とレベル番号を足して表します。都道府県・地方・世界など、将来の拡張で使います。</p>
  <div class="ext" id="ext"></div>
</main>

<script src="shapes.js"></script>
<script>
(() => {
  const S = window.PCShapes;
  const css = getComputedStyle(document.documentElement);
  const stroke = css.getPropertyValue('--line-strong').trim();
  const fill = css.getPropertyValue('--surface').trim();
  const dpr = window.devicePixelRatio || 1;

  function canvasFor(level, size, r) {
    const cv = document.createElement('canvas');
    cv.width = size * dpr; cv.height = size * dpr; cv.style.width = `${size}px`; cv.style.height = `${size}px`;
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    S.draw(c, level, { x: size / 2, y: size / 2 + (level > 10 ? 6 : 0) }, r, { fill, stroke, lineWidth: 3 });
    return cv;
  }

  const basic = document.getElementById('basic');
  for (let lv = 1; lv <= 10; lv++) {
    const card = document.createElement('div'); card.className = 'card';
    const text = document.createElement('div');
    const a = document.createElement('div'); a.className = 'lv'; a.textContent = `Lv${lv}`;
    const b = document.createElement('div'); b.className = 'nm'; b.textContent = S.SHAPE_NAMES[lv];
    const q = document.createElement('div'); q.className = 'q'; q.textContent = `問題: ${S.QUESTION_NAMES[lv]}`;
    text.append(a, b, q);
    card.append(canvasFor(lv, 72, 18), text);
    basic.append(card);
  }

  const ext = document.getElementById('ext');
  for (let lv = 11; lv <= 99; lv++) {
    const cell = document.createElement('div'); cell.className = 'cell';
    const lab = document.createElement('div'); lab.className = 'lv'; lab.textContent = `Lv${lv}`;
    cell.append(canvasFor(lv, 84, 13), lab);
    ext.append(cell);
  }
})();
</script>
</body>
</html>
