<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>称号のアイコンの見本 | パケット陣取り</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); margin: 0; }
  .page { max-width: 1100px; margin: 0 auto; padding: 16px 16px 32px; }
  h1 { font: 22px/1.3 var(--font-display); margin: 8px 0 4px; }
  h2 { font: 18px/1.3 var(--font-display); margin: 22px 0 6px; display: flex; align-items: center; gap: 8px; }
  h2 i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; }
  .desc { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
  .cell { background: var(--surface); border-radius: 10px; padding: 8px 4px; text-align: center; }
  .cell canvas { display: block; margin: 0 auto 4px; }
  .cell .nm { font-size: 13px; line-height: 1.35; }
  .cell .how { color: var(--muted); font-size: 12px; line-height: 1.3; }
</style>
</head>
<body>
<main class="page">
  <h1>称号のアイコンの見本</h1>
  <p class="desc">2026-10-26 の見本(ユーザー依頼: とりあえず作って見せる。大きさはそろえる)。どれも同じ大きさの丸いバッジで、輪の色が種類を表す。地域・島は境界の形、路線は駅を結んだ線、レベルは拠点の印の形をそのまま使い、プログラムで自動で作る。正解の数・ジャンル・記録だけ手で描く。試験の名前・会社の名前は使わない。</p>
  <div id="list"></div>
</main>
<script src="shapes100.js"></script>
<script src="title-icons.js"></script>
</body>
</html>
